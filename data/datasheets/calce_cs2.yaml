name: calce_cs2
status: signed 2026-09-03 (chemistry verified by owner-delegated web review); D12
  survey 2026-09-05 filled sampling, provenance, licence text and cut-offs
source:
  citation: 'CALCE Battery Research Group, University of Maryland: CS2 prismatic cells
    (Battery Data page); He, W., Williard, N., Osterman, M., Pecht, M. (2011). Prognostics
    of lithium-ion batteries based on Dempster-Shafer theory and the Bayesian Monte
    Carlo method. J. Power Sources 196(23), 10314-10321.'
  url: https://calce.umd.edu/battery-data
  license: 'academic use with citation — CALCE Battery Data page (fetched 2026-09-05):
    ''Use of this data for publication purposes should include references to the CALCE
    article(s) that describe the experiments conducted to generating the data''; no
    licence text'
  retrieved: 2026-09-03 (page fetched); 2026-09-05 (terms and CS2 description re-fetched)
chemistry:
  cathode: LCO
  anode: graphite (assumed; the CALCE page states only the cathode)
  metadata_label: LCO
  verified_by: owner-delegated web review 2026-09-03 (Claude Fable 5.1); sources in
    chemistry.evidence
  verified_on: '2026-09-03'
  evidence: 'CALCE Battery Data page, CS2: ''Cell Chemistry: LiCoO2 cathode, EDS results
    also showed trace elements of Manganese''; ''Capacity Rating: 1100 mAh''; charging
    ''constant current rate of 0.5C until the voltage reached 4.2V and then 4.2V was
    sustained until the charging current dropped to below 0.05A''; ''discharge cut
    off voltage for these batteries was 2.7V''.'
cell:
  format: prismatic, 5.4 x 33.6 x 50.6 mm (CALCE page); tester Arbin BT2000, CADEX
    for CS2_8 and CS2_21 (CALCE page)
  rated_capacity_ah: 1.1
  rated_source: 'CALCE page (CS2 ''Capacity Rating: 1100 mAh''; CX2 1350 mAh)'
protocol:
  segments:
  - id: cc_charge
    rate: 0.5C CC to 4.2 V, CV to 0.05 A (CALCE page); measured 0.55 A = 0.5C, 4.20
      V max in CS2_35 (2026-09-05)
  - id: discharge
    rate: '0.5C-1C per cell to 2.7 V (CALCE page: cut-off 2.7 V)'
  temperature_c:
  - 25
label_anchor:
  formula: soh = calibration_capacity / rated_capacity_ah
  measured_quantities:
  - discharge capacity (Ah)
  reference_test: capacity of each discharge (Arbin file)
  label_source: calibration_capacity
sampling:
  rate_hz: 0.0333
  interval_s: 30.015
  interval_p10_s: 30.015
  interval_p90_s: 30.015
  segments_measured: 400
  method: median per-cycle time step of the raw charge segments (sohkernel.raw_windows.iter_charge_curves,
    first 400 segments) (scripts/measure_raw_provenance.py, 2026-09-06T01:22:29Z)
  channels:
  - V
  - I
  - T
windows:
- feature: q_win_ah
  segment: cc_charge
  v_lo: 3.85
  v_hi: 4.05
  coverage_median: 0.371
  calibrated_on: '2026-08-27'
