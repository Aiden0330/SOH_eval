chemistry:
  cathode: NMC
  anode: graphite
  metadata_label: NMC
  verified_by: owner-delegated web review 2026-09-03 (Claude Fable 5.1); sources in
    chemistry.evidence
  verified_on: '2026-09-03'
  evidence: 'RWTH Publications record 818642: ''Time-series cyclic aging data on 48
    commercial NMC/graphite Sanyo/Panasonic UR18650E cylindrical cells'', nominal
    capacity 1.85 Ah; Content.pdf §2 (2026-09-06): carbon anode, NMC cathode. scripts/validate_trusted_plugin_workflow.py
    builds this table from ''Pre-processing Codes/Degradation_Prediction_Dataset_ISEA.mat''
    in github.com/isea-rwth-aachen/battery-degradation-trajectory-prediction (mirror
    of git.rwth-aachen.de/isea/..., ''48 cells during ageing tests'') keeping 8 cells;
    the per-cell maximum capacities (1.83-1.85 Ah) match. The previous label ''LFP
    (Fortelion residential storage)'' was wrong: it described the separate rwth_hss
    field data.'
cell:
  format: 18650 (Sanyo/Panasonic UR18650E)
  rated_capacity_ah: 1.85
  rated_source: 'RWTH-2021-04545 record (nominal 1.85 Ah); Content.pdf §2: grade-C
    cells of one production lot with a mean capacity of about 1.85 Ah against the
    A-grade nominal 2.05 Ah; table per-cell maximum 1.83-1.85 Ah'
protocol:
  segments:
  - id: cycling
    rate: 'Content.pdf §3: one cycle = 30 min discharge to 3.5 V then 30 min charge
      to 3.9 V, both current-limited to 4 A (about 2.2 C of the 1.85 Ah mean capacity);
      charge turnover about 1 Ah between roughly 20 % and 80 % SoC; the voltage limits
      keep the depth of discharge relative to the aged capacity nearly constant, so
      the turnover falls with SOH'
  - id: bol_and_rpt
    rate: 'Content.pdf §3: capacity at several current rates between 3.0 V and 4.1
      V; charge CC 2 A (about 1.1 C) to 4.1 V, CV until 40 mA; pulse resistances at
      three voltage levels (about 70 / 50 / 30 % SoC, set by CC 2 A then CV to 40
      mA at 25 °C); impedance spectra at three temperatures at BOL only; the RPT repeats
      the capacity and pulse tests at 25 °C without impedance'
  temperature_c:
  - 25
label_anchor:
  formula: soh = calibration_capacity / rated_capacity_ah
  measured_quantities:
  - capacity_ah
  reference_test: 'Content.pdf §3: RPT in regular intervals with capacity tests and
    pulse-resistance tests at 25 °C, no impedance; the performance measure is the
    2 A discharge capacity (about 1.1 C, 3.0 V cut-off after a CC 2 A / CV 4.1 V charge
    to 40 mA), which the mirror .mat capacity histories are taken to be (record: RPT
    ''in regular intervals''; mirror README: BOL ''capacity test with various C-rates'',
    qOCV and EIS)'
  label_source: calibration_capacity
sampling:
  rate_hz: not applicable
  method: 'not applicable: the ingested mirror .mat (Degradation_Prediction_Dataset_ISEA.mat)
    holds per-cycle capacity histories, not time series; the record''s Rawdata.zip
    time series are not ingested'
  channels: []
windows: []
