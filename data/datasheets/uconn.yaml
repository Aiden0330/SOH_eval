  verified_on: '2026-09-03'
  evidence: 'UConn Digital Commons record: ''64 LithiumWerks APR18650M1B cells'' cycled
    under 11 unique conditions to 80 % remaining capacity, with 100-second CC pulses
    at three states of charge; the dataset is titled LFP/Gr. LithiumWerks APR18650M1B
    is a LiFePO4/graphite 18650 cell, 1.1 Ah, 3.3 V nominal (vendor specification).'
