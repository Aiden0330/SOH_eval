name: tongji_ncm
status: draft 2026-09-05 (D2) — chemistry and rated capacity quoted from the paper;
  unsigned until the owner reviews
supervision: soh_supervised
source:
  citation: 'Zhu, J., Wang, Y., Huang, Y., Bhushan Gopaluni, R., Cao, Y., Heere, M.,
    Mühlbauer, M. J., Mereacre, L., Dai, H., Liu, X., Senyshyn, A., Wei, X., Knapp,
    M., Ehrenberg, H. (2022). Data-driven capacity estimation of commercial lithium-ion
    batteries from voltage relaxation. Nature Communications 13, 2261, DOI 10.1038/s41467-022-29837-w.
    Dataset: Zenodo 6405084 (DOI 10.5281/zenodo.6405084; the paper cites the concept
    record 10.5281/zenodo.6379165); ingested by scripts/ingest_tongji.py (D2, 2026-09-05).'
  url: https://doi.org/10.5281/zenodo.6405084
  license: 'CC BY 4.0 (Zenodo record 6405084 metadata: cc-by-4.0)'
  retrieved: 2026-09-05 (Zenodo API record; Dataset_2_NCM_battery.zip md5 a05c485df92f4af560d1d8d7f659ce1b
    verified against the record)
chemistry:
  cathode: NCM (NMC)
  anode: graphite with ~2 wt% Si (paper Methods, citing Sorensen et al.)
  metadata_label: NMC
  verified_by: VERIFY
  verified_on: VERIFY
  evidence: 'Nature Communications 13, 2261, Methods (''Cell selection and cycling''):
    ''… the INR18650-MJ1 battery … Li(Ni0.83Co0.11Mn0.07)O2'' … ''The INR18650-MJ1
    is named as NCM battery.'' Nature Communications 13, 2261, Methods: ''constant
    current (CC) charging to 4.2 V with current rates ranging from 0.25 C (0.875 A)
    to 1 C (3.5 A), followed by a constant voltage (CV) charging step at 4.2 V until
    a current of 0.05 C is reached. Constant current is then employed for the discharge
    to 2.65 V for the NCA cells and 2.5 V for the NCM and NCM + NCA cells''; ''The
    CC discharging capacity is treated as the battery residual capacity during cycling'';
    relaxation 30 min after charge (120 s sampling) for NCA and NCM, 60 min (30 s
    sampling) for NCM + NCA; BioLogic BCS-815 cycler, BINDER chambers (±0.2 °C).'
cell:
  format: 18650 (Samsung INR18650-MJ1, 3.5 Ah, 3.6 V)
  rated_capacity_ah: 3.5
  rated_source: paper Table 1 (nominal capacity 3.5 Ah; 1C = 3.5 A)
protocol:
  segments:
  - id: cc_cv_charge
    rate: CC 0.25C / 0.5C / 1C to 4.2 V, CV at 4.2 V to 0.05C (paper); charge segment
      = samples with <I>/mA > 10 mA (CC and CV steps)
  - id: relaxation
    rate: 'rest after charge: 30 min at 120 s sampling (NCA, NCM), 60 min at 30 s
      (NCM+NCA); not yet a feature source'
  - id: discharge
    rate: CC 1C to 2.5 V
  temperature_c:
  - 25
  - 35
  - 45
label_anchor:
  formula: soh = calibration_capacity / rated_capacity_ah
  measured_quantities:
  - Q discharge/mA.h (per-cycle CC discharge capacity)
  reference_test: 'the CC discharge capacity of each cycle: max ''Q discharge/mA.h''
    of the cycle (the paper''s residual capacity) over the nominal capacity'
  label_source: calibration_capacity
sampling:
  rate_hz: 0.1 during charge and discharge (10 s), 1/120 (NCA, NCM) or 1/30 (blend)
    in relaxation — CSV time/s
  channels:
  - V
  - I
  - Q charge
  - Q discharge
windows:
- feature: q_win_ah
  segment: cc_cv_charge
  v_lo: 3.65
  v_hi: 4.1
  coverage_median: 0.436
  calibrated_on: '2026-09-05'
  note: scan of [3.4, 4.2] V at 0.05 V steps on every 10th cycle; the mid-charge window
    shared with the SNL NMC/NCA sets
units:
  unit: cell
  cells: 55
  cells_per_condition (chamber_charge_discharge):
    25C_0.5C_1C: 23
    35C_0.5C_1C: 4
    45C_0.5C_1C: 28
verification:
  cells_per_condition_vs_paper_table_1: identical (paper Table 1 counts reproduced
    by the archive inventory)
  rows: 28003
  first_cycle_soh: 0.899–0.957 (median 0.939)
  raw_hand_check: 'one cycle of a CSV read by hand: rest, CC charge at the named rate
    to 4.2 V, CV, 28 min rest at 120 s, CC discharge to the cut-off, rest (Dataset_1
    CY25-1_1-#3 cycle 5)'
digests:
  raw: VERIFY
  processed: 4c9fd0147a3111689d3b7b74ce3c5b6376eec1cbfe6b043d9e3ca6458744450f
  curves: VERIFY
leak_scan:
  label_source_columns: []
  scanned_on: '2026-09-05'
  reference: tests/test_label_leak_inventory.py
  column_classes:
    identity:
    - dataset
    - cell_id
    - cycle_index
    label:
    - soh
    label_source:
    - charge_capacity_max
    feature:
    - time_s_max
    - voltage_mean
    - voltage_std
    - voltage_min
    - voltage_max
    - current_mean
    - current_std
    - abs_current_mean
    - temperature_mean
    - q_win_ah
    - t_win_s
    - ic_peak_ah_per_v
    - ic_peak_voltage_v
    - cycle_index_feature
    - cycle_fraction
    - hi_* (K12 indicators)
held_out_ready: true
known_issues:
- 'no temperature channel in the CSVs: temperature_mean is the chamber setpoint from
  the cell name (CY25/35/45)'
- '195 rows with soh < 0.5: the four 35 °C cells and two 45 °C cells collapse at end
  of test (soh down to 0.006); inside the QC bounds'
- relaxation features (the paper's own feature source) are not extracted; K12 §4.6
  lists them for the segment work
- 'signature pending: the owner''s review of chemistry (quoted from the paper) and
  rated capacity'
- the kernel label is NMC (metadata) for the authors' NCM
signed:
  by: VERIFY (the owner's signature; drafted 2026-09-05 by the Wave 6 data-onboarding
    session)
  'on': VERIFY
