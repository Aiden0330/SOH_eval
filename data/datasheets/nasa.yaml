  evidence: 'Web review 2026-09-03: NASA''s own description (PCoE repository, DASHlink
    resource 133, data.nasa.gov) says ''commercially available Li-ion 18650 sized
    rechargeable batteries'', rated 2 Ah, three operational profiles (charge, discharge,
    EIS) at room temperature; neither chemistry nor manufacturer is named, and the
    shipped READMEs (data/raw/nasa_full/README*.txt) only describe the .mat structure.
    Secondary literature is split: most SOH papers and the Kaggle mirror call the
    cells LiCoO2; a minority calls them ''Gen 2'' NCA/graphite cells, but the DOE
    Gen 2 18650 cells were ~1 Ah while these are rated 2 Ah. The working label LCO
    is kept for fold grouping only; no chemistry claim may rest on nasa until a primary
    source is found (VERIFY). D12 survey 2026-09-05: the README.txt shipped inside
    the archive (data/raw/nasa_battery_dataset.zip -> ''5. Battery Data Set/1. BatteryAgingARC-FY08Q4.zip'',
    dated 2008-09-30) says ''A set of four Li-ion batteries (# 5, 6, 7 and 18) were
    run through 3 different operational profiles (charge, discharge and impedance)
    at room temperature. Charging was carried out in a constant current (CC) mode
    at 1.5A until the battery voltage reached 4.2V'' and names no chemistry or manufacturer
    either.'
