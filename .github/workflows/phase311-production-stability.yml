name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      # ADR-001 direction rule: sohkernel never imports sohbench or sohagent.
      - name: Kernel direction rule
        run: python -m pytest tests/kernel -q

      - name: Backend regression
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q

      - name: Frontend regression
        run: node --test frontend/app/

  production-stability:
    name: Phase 3.1.1 production stability (windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run production stability gate
        env:
          PYTHONPATH: ${{ github.workspace }}\src
          PYTHONUTF8: "1"
        run: python scripts/run_phase311_production_stability.py

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase311-production-stability-report
          path: |
            work/trusted_plugins/phase311_production_stability_report.json
            work/trusted_plugins/phase311_production_stability_report.md
