name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      # ADR-001 direction rule: sohkernel never imports sohbench or sohagent.
      - name: Kernel direction rule
        run: python -m pytest tests/kernel -q

      - name: Backend regression
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q

      - name: Frontend regression
        run: node --test frontend/app/

  windows-regression:
    name: Regression (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Backend regression
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q

      - name: Frontend regression
        run: node --test frontend/app/
