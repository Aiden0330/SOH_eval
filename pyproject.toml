[project]
name = "sohbench"
version = "0.1.0"
description = "SOH benchmark & evaluation harness (sub-project A)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "pyarrow",
    "jsonschema",
    "pyyaml",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest"]
dl = ["torch"]
torch = ["torch"]  # kernel-facing alias of "dl" (ADR-001 extraction plan, Task 1)

[project.scripts]
sohkernel = "sohkernel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sohkernel = ["schemas/*.json"]
sohbench = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]   # a worktree's tests import the worktree's package, not the editable install of the main checkout
